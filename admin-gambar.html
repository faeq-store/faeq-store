<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Faeq Store — Admin Panel</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f7f6;color:#17231f}
header{background:#07110d;color:#fff;padding:18px}.wrap{width:min(1050px,calc(100% - 24px));margin:auto}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:11px}.logo{width:43px;height:43px;border-radius:13px;background:linear-gradient(135deg,#00b978,#ed1474);display:grid;place-items:center;font-weight:950}
.head h1{font-size:20px;margin:0}.head small{color:#9baaa5}.back{color:#fff;text-decoration:none;border:1px solid #39443f;padding:9px 13px;border-radius:11px;font-weight:800}
.grid{display:grid;grid-template-columns:390px 1fr;gap:18px;margin:22px 0}.card{background:#fff;border:1px solid #dce9e4;border-radius:20px;padding:20px;box-shadow:0 8px 25px #163c3010}
h2{font-size:20px;margin:0 0 5px}.sub{color:#7e9089;font-size:13px;margin:0 0 18px}
label{display:block;font-size:13px;font-weight:850;margin:13px 0 6px}input,select{width:100%;padding:12px;border:1px solid #d8e6e1;border-radius:11px;outline:none;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:900;cursor:pointer}.add{width:100%;margin-top:16px;background:#07110d;color:#fff}.danger{background:#ffe8ee;color:#c91757}
.item{display:flex;align-items:center;gap:12px;border:1px solid #e0ebe7;border-radius:14px;padding:12px;margin-top:10px}.thumb{width:58px;height:58px;border-radius:12px;background:linear-gradient(135deg,#00b978,#064535);display:grid;place-items:center;color:#fff;font-weight:950;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.iteminfo{flex:1}.iteminfo b{display:block}.iteminfo small{color:#7e9089}.actions{display:flex;gap:6px}.empty{text-align:center;padding:35px;color:#82918c;border:2px dashed #e0e9e6;border-radius:15px}
.notice{padding:12px;border-radius:12px;background:#effaf5;color:#087d5b;font-size:12px;line-height:1.5;margin-bottom:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.head{align-items:flex-start}.row{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="wrap head"><div class="brand"><div class="logo">F</div><div><h1>Faeq Store Admin</h1><small>Kelola produk toko</small></div></div><a class="back" href="index.html">← Toko</a></div></header>
<main class="wrap grid">
<section class="card">
<h2>➕ Tambah Produk</h2><p class="sub">Perubahan tersimpan di browser ini.</p>
<div class="notice">Versi ini adalah admin lokal. Agar perubahan dari admin bisa terlihat oleh semua pelanggan, toko perlu database online/backend.</div>
<label>Nama Produk</label><input id="name" placeholder="Contoh: Paket Premium">
<label>Deskripsi</label><input id="desc" placeholder="Deskripsi produk"><label>Gambar Produk</label><input id="image" type="file" accept="image/*">
<div class="row"><div><label>Harga</label><input id="price" type="number" placeholder="15000"></div><div><label>Harga Coret</label><input id="old" type="number" placeholder="25000"></div></div>
<div class="row"><div><label>Stok</label><input id="stock" type="number" placeholder="10"></div><div><label>Kategori</label><select id="cat"><option value="indo">Indo 🇮🇩</option><option value="rare">Rare 📈</option><option value="top">Top Pick ⭐</option></select></div></div>
<button class="btn add" onclick="addProduct()">Simpan Produk</button>
</section>
<section class="card"><h2>📦 Produk</h2><p class="sub">Tambah atau hapus produk yang tampil di toko.</p><div id="list"></div></section>
</main>
<script>
const defaults=[
{name:"Bocil Main ML",desc:"🌿 Bocil Di C**iin Di Sekolah Sampai Keluar",price:500,old:1000,stock:7,cat:"indo top",badge:"★ BARU • TOP PICK ★"},
{name:"Bocil GAG [isi 50+]",desc:"Bocil GAG [isi 50+] Main Sendiri Sampai Keluar Air...",price:50000,old:55000,stock:0,cat:"rare",badge:"♛ RARE • LEGENDARY ★"},
{name:"Paket Digital A",desc:"Paket digital pilihan dengan proses cepat.",price:5000,old:10000,stock:18,cat:"indo top",badge:"★ BARU • TOP PICK ★"},
{name:"Paket Premium",desc:"Produk premium untuk kebutuhan digital kamu.",price:15000,old:25000,stock:12,cat:"top",badge:"★ TOP PICK ★"}];
let products=JSON.parse(localStorage.getItem("faeq_products")||"null")||defaults;
const rp=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n);
function save(){localStorage.setItem("faeq_products",JSON.stringify(products));render()}
function addProduct(){
 const name=document.getElementById("name").value.trim(),desc=document.getElementById("desc").value.trim();
 const price=+document.getElementById("price").value,old=+document.getElementById("old").value,stock=+document.getElementById("stock").value,cat=document.getElementById("cat").value;
 if(!name||!price){alert("Nama dan harga wajib diisi.");return}
 products.unshift({name,desc:desc||"Produk digital Faeq Store.",price,old,stock,cat,badge:cat==="rare"?"♛ RARE ★":cat==="top"?"★ TOP PICK ★":"★ BARU ★"});
 save();["name","desc","price","old","stock"].forEach(id=>document.getElementById(id).value="");alert("Produk berhasil disimpan.");
}
function del(i){if(confirm("Hapus produk ini?")){products.splice(i,1);save()}}
function render(){
 const box=document.getElementById("list");
 box.innerHTML=products.length?products.map((p,i)=>`<div class="item"><div class="thumb">${p.image?`<img src="${p.image}" alt="">`:"F"}</div><div class="iteminfo"><b>${esc(p.name)}</b><small>${rp(p.price)} • Stok ${p.stock}</small></div><div class="actions"><button class="btn danger" onclick="del(${i})">Hapus</button></div></div>`).join(""):'<div class="empty">Belum ada produk.</div>';
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
render();
</script>
</body>
</html>
