<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Faeq Store</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07070d;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:20px}
.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{margin:0 0 6px}.muted{color:#aaa}
.tabs{display:flex;gap:8px;margin:20px 0}.tab{padding:11px 15px;border:1px solid #333;background:#11131b;color:#fff;border-radius:10px;cursor:pointer}.tab.active{background:#fff;color:#000}
.panel{background:#10111a;border:1px solid #292b38;border-radius:16px;padding:18px;margin-bottom:18px}.hidden{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
input,textarea{width:100%;padding:12px;margin:6px 0 10px;border:1px solid #333;background:#080910;color:#fff;border-radius:9px}
button{border:0;border-radius:9px;padding:11px 14px;cursor:pointer;font-weight:700}.primary{background:#fff;color:#000}.danger{background:#d33;color:#fff}.ghost{background:#252735;color:#fff}
.product,.order{border:1px solid #2c2e3b;border-radius:13px;padding:14px;margin:10px 0;background:#0b0c13}.product img{width:100%;height:150px;object-fit:cover;border-radius:10px;background:#191b25}
.price{font-size:18px;font-weight:700}.badge{font-size:12px;color:#aaa}.status{padding:5px 9px;border-radius:20px;background:#262839;font-size:12px}.notice{padding:12px;border-radius:10px;background:#171927;color:#bbb;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><h1>⚡ Faeq Store — Admin</h1><div class="muted">Kelola produk dan pesanan masuk</div></div><button class="ghost" onclick="loadAll()">🔄 Refresh</button></div>
<div class="tabs"><button class="tab active" id="tabProducts" onclick="showTab('products')">📦 Produk</button><button class="tab" id="tabOrders" onclick="showTab('orders')">🛒 Pesanan Masuk</button></div>

<section id="products">
<div class="panel"><h2>Tambah Produk</h2><div class="grid">
<div><label>Nama produk</label><input id="name" placeholder="Nama produk"></div>
<div><label>Harga</label><input id="price" type="number" placeholder="10000"></div>
<div><label>Harga lama</label><input id="oldPrice" type="number" placeholder="15000"></div>
<div><label>Stok</label><input id="stock" type="number" value="10"></div>
<div><label>Kategori</label><input id="category" placeholder="Akun / File / Top Up"></div>
<div><label>URL gambar</label><input id="imageUrl" placeholder="https://..."></div>
</div><label>Deskripsi</label><textarea id="description" rows="3" placeholder="Deskripsi produk"></textarea><button class="primary" onclick="addProduct()">➕ Tambah Produk</button></div>
<div class="panel"><div class="row"><h2>Daftar Produk</h2><span id="productCount" class="muted"></span></div><div id="productList">Memuat...</div></div>
</section>

<section id="orders" class="hidden"><div class="panel"><div class="row"><h2>🛒 Pesanan Masuk</h2><button class="ghost" onclick="loadOrders()">🔄 Refresh Pesanan</button></div>
<div class="notice">Pesanan dari website akan muncul di sini. Email pembeli dapat digunakan untuk menghubungi pembeli.</div><div id="orderList">Memuat...</div></div></section>
</div>

<script>
const SUPABASE_URL='https://jjqdtuwoafvdhsnzsyaf.supabase.co';
const SUPABASE_KEY='sb_publishable_bMCnRCMu8Yb0uqGUeGB2OQ_ek6WkJQr';
const headers={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};
function showTab(tab){document.getElementById('products').classList.toggle('hidden',tab!=='products');document.getElementById('orders').classList.toggle('hidden',tab!=='orders');document.getElementById('tabProducts').classList.toggle('active',tab==='products');document.getElementById('tabOrders').classList.toggle('active',tab==='orders');if(tab==='orders')loadOrders()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rupiah(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}
async function loadProducts(){const box=document.getElementById('productList');try{const r=await fetch(SUPABASE_URL+'/rest/v1/products?select=*&order=created_at.desc',{headers});if(!r.ok)throw Error(await r.text());const data=await r.json();document.getElementById('productCount').textContent=data.length+' produk';if(!data.length){box.innerHTML='<div class="muted">Belum ada produk.</div>';return}box.innerHTML=data.map(p=>`<div class="product"><div class="grid"><div>${p.image_url?`<img src="${esc(p.image_url)}" onerror="this.style.display='none'">`:''}</div><div><div class="row"><h3>${esc(p.name)}</h3><span class="badge">${esc(p.category||'')}</span></div><p class="muted">${esc(p.description||'')}</p><div class="price">${rupiah(p.price)}</div>${p.old_price?`<div class="muted">Harga lama: <s>${rupiah(p.old_price)}</s></div>`:''}<div class="row"><span>Stok: ${esc(p.stock)}</span><button class="danger" onclick="deleteProduct('${esc(p.id)}')">🗑️ Hapus</button></div></div></div></div>`).join('')}catch(e){box.innerHTML='<div class="muted">Gagal memuat produk: '+esc(e.message)+'</div>'}}
async function addProduct(){const name=document.getElementById('name').value.trim(),price=Number(document.getElementById('price').value);if(!name||!price){alert('Nama dan harga wajib diisi.');return}const body={name,description:document.getElementById('description').value.trim(),price,old_price:Number(document.getElementById('oldPrice').value)||null,stock:Number(document.getElementById('stock').value)||0,category:document.getElementById('category').value.trim()||'Lainnya',image_url:document.getElementById('imageUrl').value.trim()||''};const r=await fetch(SUPABASE_URL+'/rest/v1/products',{method:'POST',headers:{...headers,'Prefer':'return=minimal'},body:JSON.stringify(body)});if(!r.ok){alert('Gagal menambah produk:\n'+await r.text());return}alert('Produk berhasil ditambahkan.');['name','price','oldPrice','description','category','imageUrl'].forEach(id=>document.getElementById(id).value='');document.getElementById('stock').value=10;loadProducts()}
async function deleteProduct(id){if(!confirm('Hapus produk ini?'))return;const r=await fetch(SUPABASE_URL+'/rest/v1/products?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers});if(!r.ok){alert('Gagal menghapus produk:\n'+await r.text());return}loadProducts()}
async function loadOrders(){const box=document.getElementById('orderList');box.innerHTML='Memuat pesanan...';try{const r=await fetch(SUPABASE_URL+'/rest/v1/orders?select=*&order=created_at.desc',{headers});if(!r.ok)throw Error(await r.text());const data=await r.json();if(!data.length){box.innerHTML='<div class="muted">Belum ada pesanan masuk.</div>';return}box.innerHTML=data.map(o=>`<div class="order"><div class="row"><strong>📦 ${esc(o.product_name)}</strong><span class="status">${esc(o.status||'pending')}</span></div><p>📧 <a href="mailto:${esc(o.buyer_email)}" style="color:#fff">${esc(o.buyer_email)}</a></p>${o.price!=null?`<p>💰 ${rupiah(o.price)}</p>`:''}${o.note?`<p>📝 ${esc(o.note)}</p>`:''}<small class="muted">🕒 ${o.created_at?new Date(o.created_at).toLocaleString('id-ID'):''}</small></div>`).join('')}catch(e){box.innerHTML='<div class="muted">Gagal memuat pesanan: '+esc(e.message)+'</div>'}}
async function loadAll(){await loadProducts();if(!document.getElementById('orders').classList.contains('hidden'))await loadOrders()}loadAll();
</script>
</body>
</html>
